<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><script src="config.js"></script></head><body>
<title>NEXORA AIR</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Concept: modern airline site built from the NEXORA livery board. Cloud-white ground, floating glass header, photographic hero in deep green, soft rounded cards. Lime appears only on dark green or as small accents. */
:root{
  --bg:#F4F6F8; --surface:#fff; --surface2:#EBF0F3; --fg:#0F1F19; --muted:#5A6B74; --line:#DCE3E8;
  --brand:#0B5E3B; --brand2:#094A2F; --brand-fg:#fff; --lime:#7ED321; --lime-ink:#4E9A0E; --gray:#9AA4B2; --soft:#E0F0E7; --hero:#073B26;
  --good:#1B7F3C; --good-s:#DFF2E3; --warn:#8A5A00; --warn-s:#FBEBCB; --bad:#B3261E; --bad-s:#FBE0DD;
  --glass:rgba(255,255,255,.78); --shadow:0 1px 2px rgba(10,40,28,.05),0 8px 24px -12px rgba(10,40,28,.18);
  --display:'Space Grotesk',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08110D; --surface:#0F1D17; --surface2:#15261E; --fg:#E7F0EB; --muted:#92A69B; --line:#21362B;
  --brand:#7ED321; --brand2:#6BBE16; --brand-fg:#08200F; --lime-ink:#7ED321; --soft:#143321; --hero:#07281B;
  --good:#62D17F; --good-s:#143221; --warn:#E8B04A; --warn-s:#3A2E12; --bad:#F08A82; --bad-s:#3F1D1B;
  --glass:rgba(15,29,23,.78); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08110D; --surface:#0F1D17; --surface2:#15261E; --fg:#E7F0EB; --muted:#92A69B; --line:#21362B;
  --brand:#7ED321; --brand2:#6BBE16; --brand-fg:#08200F; --lime-ink:#7ED321; --soft:#143321; --hero:#07281B;
  --good:#62D17F; --good-s:#143221; --warn:#E8B04A; --warn-s:#3A2E12; --bad:#F08A82; --bad-s:#3F1D1B;
  --glass:rgba(15,29,23,.78); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:1.85rem;line-height:1.1}h2{font-size:1.05rem}h3{font-size:.97rem}p{margin:0}
a{color:var(--brand)}.mono{font-family:var(--mono);font-size:.92em}.muted{color:var(--muted)}.nw{white-space:nowrap}
.wrap{max-width:1200px;margin:0 auto;min-width:0}
.top{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:9;margin-top:8px;display:flex;align-items:center;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;padding:8px 10px 8px 16px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg)}
.brand .wm{font-family:var(--display);font-weight:700;font-size:1.2rem;letter-spacing:.01em;line-height:1}.brand .wm i{font-style:normal;color:var(--lime-ink)}
.brand small{font-family:var(--mono);font-size:.64rem;color:var(--muted);letter-spacing:.06em;border-left:1px solid var(--line);padding-left:10px}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.nav a{white-space:nowrap;padding:7px 12px;border-radius:99px;color:var(--muted);text-decoration:none;font-weight:500}
.nav a:hover{color:var(--fg);background:var(--surface2)}.nav a[aria-current="page"]{color:var(--brand-fg);background:var(--brand)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hero{position:relative;overflow:hidden;border-radius:24px;margin-top:16px;color:#fff;background:var(--hero);padding:44px 36px 0;display:flex;flex-direction:column;gap:18px}
.hero .strip{margin:6px -36px 0;aspect-ratio:1536/258;background:linear-gradient(180deg,var(--hero) 0,rgba(7,59,38,0) 42%),url(img/livery.jpg) center/cover}
.hero h1{font-size:clamp(2.2rem,5.2vw,3.6rem);line-height:1.02;max-width:16ch}.hero .lime{color:var(--lime)}.hero p{max-width:50ch;color:#D8EBE0;font-size:1.02rem}
.hero .eyebrow{color:var(--lime)}
.search{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;background:rgba(255,255,255,.14);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.22);padding:12px;border-radius:16px;max-width:720px}
.search label{color:#E5F3EA;flex:1 1 150px}.search select,.search input{background:#fff;color:#0F1F19;border-color:transparent}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--lime-ink);font-weight:500}
.legal{background:var(--warn-s);color:var(--warn);border-radius:12px;padding:9px 16px;font-size:.8rem}
main{display:flex;flex-direction:column;gap:20px;padding-top:20px;min-width:0;animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px}.head p{color:var(--muted);max-width:64ch;margin-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;min-width:0;box-shadow:var(--shadow);overflow:hidden}
.card>header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:13px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pad{padding:18px}.stack{display:flex;flex-direction:column;gap:10px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr))}.grid>*{min-width:0}
.cols{display:grid;gap:18px;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
@media(max-width:820px){.cols{grid-template-columns:minmax(0,1fr)}.hero{padding:28px 20px 0}.hero .strip{margin:6px -20px 0}}
.shell{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;padding-top:18px}
.side{display:flex;flex-direction:column;gap:2px;align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px)}
.side h4{margin:14px 0 4px 10px;font-size:.66rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}.side h4:first-child{margin-top:0}
.side a{padding:7px 12px;border-radius:10px;color:var(--fg);text-decoration:none}
.side a:hover{background:var(--surface2)}.side a[aria-current="page"]{background:var(--brand);color:var(--brand-fg);font-weight:600}
@media(max-width:860px){.shell{grid-template-columns:minmax(0,1fr);gap:10px}.side{position:static;flex-direction:row;overflow-x:auto;gap:4px;align-items:center}.side h4{display:none}.side a{white-space:nowrap}}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.87rem}
th{font-size:.66rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600;text-align:left;padding:10px 16px;white-space:nowrap;background:var(--surface2)}
td{padding:11px 16px;border-top:1px solid var(--line);vertical-align:middle}
tbody tr:hover td{background:color-mix(in srgb,var(--soft) 45%,transparent)}
.num{text-align:right;font-variant-numeric:tabular-nums}tr.me td{background:var(--soft)}
.empty{padding:26px 16px;color:var(--muted);text-align:center}
.btn{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 14px;border-radius:10px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block;transition:transform .12s,border-color .12s,background .12s}
.btn:hover{border-color:var(--muted);transform:translateY(-1px)}
.btn.pri{background:linear-gradient(180deg,var(--brand),var(--brand2));border-color:var(--brand2);color:var(--brand-fg)}
.btn.lime{background:var(--lime);border-color:var(--lime);color:#0A1F10;font-weight:600}
.btn.ghost{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.55)}
.btn.good{color:var(--good);border-color:var(--good)}.btn.bad{color:var(--bad);border-color:var(--bad)}.btn.sm{padding:4px 11px;font-size:.8rem;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.pill{display:inline-block;font-size:.72rem;font-weight:600;border-radius:99px;padding:2px 10px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-s);color:var(--good)}.pill.warn{background:var(--warn-s);color:var(--warn)}.pill.bad{background:var(--bad-s);color:var(--bad)}.pill.acc{background:var(--soft);color:var(--brand)}
label{display:flex;flex-direction:column;gap:5px;font-size:.78rem;color:var(--muted);font-weight:500;min-width:0}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 11px;min-width:0;width:100%}
input[type=checkbox]{width:auto}textarea{min-height:76px;resize:vertical}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}.form .full{grid-column:1/-1}
.filters{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));padding:16px}
.err{color:var(--bad);font-size:.82rem}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--lime));border-radius:99px}
.tiles{display:flex;flex-wrap:wrap}.tiles>div{flex:1 1 140px;padding:18px 20px;border-right:1px solid var(--line)}.tiles>div:last-child{border:0}
.tiles b{display:block;font-family:var(--display);font-size:1.9rem;font-variant-numeric:tabular-nums;line-height:1.1}.tiles span{font-size:.75rem;color:var(--muted)}
.list>div{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 18px;border-top:1px solid var(--line);flex-wrap:wrap}.list>div:first-child{border-top:0}
.route{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-family:var(--mono)}.route i{font-style:normal;color:var(--muted)}
.steps{display:flex;flex-wrap:wrap;gap:6px}.steps span{padding:5px 12px;border-radius:99px;background:var(--surface2);color:var(--muted);font-size:.78rem;font-weight:500}
.steps span.done{background:var(--soft);color:var(--brand)}.steps span.now{background:var(--brand);color:var(--brand-fg)}.steps span.rev{background:var(--warn-s);color:var(--warn)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{font:inherit;border:0;background:var(--surface);color:var(--muted);padding:6px 13px;cursor:pointer}.seg button[aria-pressed=true]{background:var(--brand);color:var(--brand-fg)}
.bg{position:fixed;inset:0;background:rgba(4,12,8,.6);backdrop-filter:blur(3px);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:18px;width:100%;max-width:560px;max-height:100%;overflow:auto}
.modal.wide{max-width:860px}.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px 18px;margin:0}.kv div{min-width:0}.kv dt{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}.kv dd{margin:2px 0 0;overflow-wrap:anywhere}.psec{border-top:1px solid var(--line);padding-top:12px}
.modal>header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:12px;z-index:30;max-width:calc(100% - 32px);text-align:center}
.cert{border:3px double var(--brand);padding:22px;text-align:center;display:flex;flex-direction:column;gap:8px;margin:16px;border-radius:6px}
.foot{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:.78rem;display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between}
.ph{aspect-ratio:16/9;background:linear-gradient(135deg,var(--surface2),var(--soft));display:flex;align-items:center;justify-content:center;color:var(--gray)}
.fc{padding:0;display:flex;flex-direction:column}.fc .im{aspect-ratio:16/9;width:100%;object-fit:cover;display:block;background:var(--surface2)}.fc .in{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;padding:12px}.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;display:block}
.gal .g{position:relative}.gal .g button{position:absolute;top:4px;right:4px}
.cta{border-radius:20px;color:#fff;padding:32px;background:linear-gradient(100deg,rgba(7,59,38,.96),rgba(7,59,38,.6)),url(img/winglet.jpg) right/cover,var(--hero);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.cta p{color:#D8EBE0}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{display:inline-flex;align-items:center;gap:6px;background:var(--soft);color:var(--brand);border-radius:99px;padding:3px 6px 3px 12px;font-family:var(--mono);font-size:.78rem}
.chip button{border:0;background:rgba(0,0,0,.08);color:inherit;border-radius:50%;width:18px;height:18px;line-height:16px;cursor:pointer;padding:0}
.stage{border:1px dashed var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.addr{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}.addr label{flex:1 1 110px}
.pager{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.foot .btn{margin-left:6px}

/* ---- marca: logos, ambiente ---- */
.brand img{width:auto}.lg.lg-d{display:none}.brand .lg.lg-l{display:block}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lg.lg-l{display:none}:root:not([data-theme="light"]) .brand .lg.lg-d{display:block}}
:root[data-theme="dark"] .lg.lg-l{display:none}:root[data-theme="dark"] .brand .lg.lg-d{display:block}
body{background-image:radial-gradient(900px 420px at 85% -80px,color-mix(in srgb,var(--lime) 13%,transparent),transparent 70%),radial-gradient(700px 380px at -10% 20%,color-mix(in srgb,var(--brand) 9%,transparent),transparent 70%);background-attachment:fixed}
.eyebrow::before{content:"";display:inline-block;width:18px;height:2px;background:var(--lime);vertical-align:middle;margin-right:8px;border-radius:2px}
.head h1::after{content:"";display:block;width:44px;height:4px;border-radius:4px;margin-top:8px;background:linear-gradient(90deg,var(--brand),var(--lime))}
.card{transition:transform .18s,box-shadow .18s}.grid>.card:hover{transform:translateY(-2px)}
.tiles b{background:linear-gradient(120deg,var(--fg),var(--brand));-webkit-background-clip:text;background-clip:text;color:transparent}
.side a[aria-current="page"]{box-shadow:inset 3px 0 0 var(--lime)}
.nav a[aria-current="page"]{box-shadow:0 6px 16px -8px var(--brand)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin-bottom:-4px}
.tabs a{white-space:nowrap;padding:9px 16px;color:var(--muted);text-decoration:none;font-weight:500;border-radius:10px 10px 0 0}
.tabs a:hover{color:var(--fg);background:var(--surface2)}.tabs a[aria-selected="true"]{color:var(--brand);box-shadow:inset 0 -3px var(--lime);font-weight:600}
/* ---- portada ---- */
.hero2{position:relative;overflow:hidden;border-radius:26px;margin-top:16px;color:#fff;background:linear-gradient(105deg,#03100A 30%,rgba(3,16,10,.55) 100%),url(img/hero-x.jpg) right center/cover,#03100A;isolation:isolate}
.hero2::before{content:"";position:absolute;inset:0;z-index:-1;background-image:radial-gradient(rgba(126,211,33,.16) 1px,transparent 1.4px);background-size:18px 18px;mask-image:linear-gradient(90deg,#000,transparent 70%);-webkit-mask-image:linear-gradient(90deg,#000,transparent 70%)}
.h2-in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:28px;padding:40px 36px 26px;align-items:center}
.h2-txt{display:flex;flex-direction:column;gap:16px;align-items:flex-start;min-width:0}.h2-txt .search{width:100%}
.hero2 h1{font-size:clamp(2.3rem,5vw,3.8rem);line-height:1;max-width:14ch}.hero2 h1 .lime{color:var(--lime)}.hero2 p{color:#D1E6DA;max-width:46ch;font-size:1.02rem}.hero2 .eyebrow{color:var(--lime)}
.h2-map{min-width:0}
.h2-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));border-top:1px solid rgba(255,255,255,.14);background:rgba(3,16,10,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.h2-stats>div{padding:16px 22px;border-right:1px solid rgba(255,255,255,.1)}.h2-stats>div:last-child{border:0}
.h2-stats b{display:block;font-family:var(--display);font-size:1.8rem;line-height:1.1;font-variant-numeric:tabular-nums}.h2-stats span{font-size:.74rem;color:#B5CFC2}
@media(max-width:900px){.h2-in{grid-template-columns:minmax(0,1fr);padding:26px 20px 18px}}
/* ---- mapa en vivo ---- */
.lmap{position:relative;border-radius:16px;overflow:hidden;background:radial-gradient(120% 100% at 50% 0,#0F3A27 0,#06150E 70%);border:1px solid rgba(126,211,33,.22);box-shadow:inset 0 0 60px rgba(0,0,0,.45)}
.lmap svg{display:block;width:100%;height:auto;aspect-ratio:360/136}
.lmap .dots{fill:none;stroke:rgba(126,211,33,.34);stroke-width:1.15;stroke-linecap:round}
.lmap .rt{fill:none;stroke:rgba(255,255,255,.22);stroke-width:.35;stroke-dasharray:1.2 1.4}.lmap .tr{fill:none;stroke:rgba(126,211,33,.35);stroke-width:.4}
.lmap .fl{fill:none;stroke-width:.7;stroke-linecap:round}.lmap .fl.VATSIM{stroke:#38BDF8}.lmap .fl.IVAO{stroke:#FB9F3C}
.lmap .ap{fill:#fff;opacity:.85}
.lmap .pl path{fill:#fff}.lmap .pl.VATSIM{color:#38BDF8}.lmap .pl.IVAO{color:#FB9F3C}.lmap .pl.VATSIM path{fill:#B8E8FF}.lmap .pl.IVAO path{fill:#FFE0BD}
.lmap .ring{fill:none;stroke:currentColor;stroke-width:.5;transform-box:fill-box;transform-origin:center;animation:ping 2.2s ease-out infinite}
@keyframes ping{from{transform:scale(.4);opacity:.95}to{transform:scale(2.2);opacity:0}}
.lm-leg{position:absolute;left:10px;top:10px;z-index:2;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.72rem;color:#E4F2EA}
.lm-leg>*{background:rgba(3,16,10,.72);border:1px solid rgba(255,255,255,.14);border-radius:99px;padding:3px 10px;display:inline-flex;align-items:center;gap:6px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.lm-leg i{width:8px;height:8px;border-radius:50%;display:inline-block}.lm-leg i.VATSIM{background:#38BDF8}.lm-leg i.IVAO{background:#FB9F3C}.lm-leg b{color:var(--lime)}
.pill.net.VATSIM{background:rgba(56,189,248,.16);color:#0A74A3}.pill.net.IVAO{background:rgba(251,159,60,.2);color:#9A5200}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill.net.VATSIM{color:#7DD3FC}:root:not([data-theme="light"]) .pill.net.IVAO{color:#FDBA74}}
:root[data-theme="dark"] .pill.net.VATSIM{color:#7DD3FC}:root[data-theme="dark"] .pill.net.IVAO{color:#FDBA74}
/* ---- panel de salidas (Solari) ---- */
.board{background:#07110C;border-radius:14px;padding:6px 14px 12px;color:#FFC93C;font-family:var(--mono);overflow-x:auto;border:1px solid #1B2F24;box-shadow:inset 0 2px 20px rgba(0,0,0,.6)}
.br{display:grid;grid-template-columns:78px 92px minmax(170px,1fr) 112px 176px;white-space:nowrap;gap:10px;padding:8px 0;border-top:1px solid #16271E;font-size:.9rem;min-width:700px;letter-spacing:.04em}
.br.bh{border:0;color:#6F8B7B;font-size:.66rem;text-transform:uppercase;letter-spacing:.14em}
.br span i{display:inline-block;font-style:normal;min-width:.62em;text-align:center;animation:flip .55s both;background:linear-gradient(180deg,#0E1C15 49%,#050B08 50%);margin-right:1px;padding:0 1px;border-radius:2px}

  if(out==='short'){mins=6;an.push(t('Duración anormalmente corta','Abnormally short duration'))}
  if(out==='route')an.push(t('Aeropuerto de llegada distinto al reservado','Arrival airport differs from booking'));
  const now=Date.now(),before=rankOf(stats(p.id).h).i;
  const e={id:uid('L'),pilot:p.id,no:r.kind==='free'?'CHARTER':r.no,kind:r.kind,from:r.from,to:r.to,type:r.type,platform:plat,depTs:now-mins*MIN,arrTs:now,mins,nm:r.nm,status:an.length?'En revisión':'Completado',session:r.session,sb:r.simbrief?(r.simbrief.disc?'discrepancia':'ok'):'none',an,pn:plat!==r.platform?t('Plataforma distinta a la reservada','Platform differs from booking'):''};
  S.log.push(e);r.entryId=e.id;rlog(r,t('Vuelo finalizado; datos recopilados','Flight ended; data collected'));
  if(an.length){r.status='review';rlog(r,t('En revisión: ','Under review: ')+an.join(', '));notify(p.id,t('Tu vuelo ','Your flight ')+e.no+t(' está en revisión.',' is under review.'))}
  else validated(r,e,before);save();return e}
function validated(r,e,before){const p=pilot(e.pilot);if(r)r.status='closed';rlog&&r&&rlog(r,t('Validado automáticamente','Automatically validated'));
  e.status='Completado';flightTx(e);if(p.status==='Inactive'){p.status='Active';notify(p.id,t('Cuenta reactivada.','Account reactivated.'))}
  settle();const a=rankOf(stats(p.id).h);if(a.i>before)notify(p.id,t('¡Ascenso a ','Promoted to ')+a.n+'!');
  notify(p.id,t('Vuelo ','Flight ')+e.no+' '+e.from+'-'+e.to+t(' validado y añadido a tu Logbook.',' validated and added to your Logbook.'))}
function cancelRes(r,why){r.status='cancelled';rlog(r,why||t('Cancelada por el piloto','Cancelled by pilot'))}
function rejectEntry(e){S.log=S.log.filter(x=>x.id!==e.id);S.tx=S.tx.filter(x=>x.ref!=='fl:'+e.id);const r=S.res.find(x=>x.entryId===e.id);if(r){r.status='rejected';r.hidden=1}settle();notify(e.pilot,t('Vuelo ','Flight ')+e.no+t(' rechazado: se han revertido horas, millas y puntos.',' rejected: hours, miles and points were reverted.'))}
function score(i,p){let s=0;const L=lE(p.id),rk=rankOf(stats(p.id).h).i;
  if(p.hub&&i.from===p.hub)s+=30;if(p.fav.includes(i.no))s+=25;if(p.favT.includes(i.type))s-=8;
  if(TOURS.some(tr=>(S.enroll[p.id]||{})[tr.id]&&tr.stages.some(st=>st.some(r=>r[0]===i.from&&r[1]===i.to))))s+=15;
  if(!L.some(e=>e.to===i.to||e.from===i.to))s+=10;if(i.nm>2500&&rk<2)s-=20;if(i.nm<500&&rk>=3)s-=8;
  if(i.ts-Date.now()<3*H)s+=20;return s+i.free/i.slots*10}

let RT=[],RTOK=false;
const BITS=[['A20N',1],['A21N',2],['B738',4],['B789',8],['E195',16]];
async function loadData(){
  try{const a=await (await fetch('airports.csv')).text();a.split('\n').forEach(l=>{const c=l.split(',');if(c.length>=5&&!APX[c[0]])APX[c[0]]=[+c[1],+c[2],c[3],c[4]]})}catch(e){}
  try{const x=JSON.parse(localStorage.getItem('nexora-va-apx')||'null');if(x)Object.assign(APX,x)}catch(e){}
  try{let r=null;try{r=localStorage.getItem('nexora-va-rt')}catch(e){}if(!r)r=await (await fetch('routes.csv')).text();RT=r.split('\n').filter(Boolean).map(l=>{const c=l.split(',');return[norm(c[0]),norm(c[1]),+c[2]]});RTOK=true}catch(e){}
  render()}
function importAirports(txt){const o={};let n=0;txt.split(/\r?\n/).forEach(l=>{const m=l.match(/("([^"]*)"|[^,]*)(,|$)/g);if(!m)return;const c=m.map(x=>x.replace(/,$/,'').replace(/^"|"$/g,''));if(c.length<8)return;const iata=c[4];if(/^[A-Z]{3}$/.test(iata)&&!isNaN(+c[6])&&!isNaN(+c[7])){o[iata]=[+c[6],+c[7],c[2],c[3]];n++}});
  Object.assign(APX,o);try{localStorage.setItem('nexora-va-apx',JSON.stringify(o))}catch(e){}return n}
const EQM={};[['320 32N 32S 32A 319 31N 318 31B',1],['321 32B 32Q',2],['738 73H 73W 737 73G 73J 73C 739 73Y 7M8 7M9 733 734 735 736 73F 73R 73M 73X',4],['787 788 789 78X 332 333 330 359 351 358 763 764 767 772 773 77L 77W 777 744 748 388 343 346 345 342 340 310',8],['E90 E95 E70 E75 E7W E170 E190 E195 CR9 CRJ CR7 CR2 CR1 ERJ ER4 ER3 DH4',16]].forEach(([k,b])=>k.split(' ').forEach(x=>EQM[x]=b));
function importRoutes(txt){const L=txt.split(/\r?\n/).filter(Boolean),p=new Map();
  if(/Source Airport/i.test(L[0])){L.slice(1).forEach(l=>{const c=l.split(',');const a=c[2],b=c[4];if(/^[A-Z]{3}$/.test(a)&&/^[A-Z]{3}$/.test(b)&&a!==b){const k=a+','+b;let m=p.get(k)||0;(c[8]||'').split(' ').forEach(e=>m|=EQM[e]||0);p.set(k,m)}})}
  else L.forEach(l=>{const c=l.split(',');if(/^[A-Za-z]{3}$/.test(c[0])&&/^[A-Za-z]{3}$/.test(c[1]))p.set(c[0].toUpperCase()+','+c[1].toUpperCase(),+c[2]||0)});
  if(!p.size)return 0;const out=[...p].map(([k,m])=>k+','+m).join('\n');try{localStorage.setItem('nexora-va-rt',out)}catch(e){return -1}return p.size}
const holds=pid=>S.res.filter(r=>r.pilot===pid&&r.kind==='route'&&['reserved','checkedin','flying'].includes(r.status));
function compat(nm,mask){return Object.keys(TYPES).filter(k=>TYPES[k].r*.9>=nm).sort((a,b)=>((mask&BITS.find(x=>x[0]===b)[1])?1:0)-((mask&BITS.find(x=>x[0]===a)[1])?1:0))}
function openRoute(a,b,mask){const p=me();if(!p){go('login');return}const e=whyNot(p);if(e){toast(e);return}const nm=dist(a,b);
  if(!nm){toast(t('Faltan las coordenadas de un aeropuerto. Importa airports.dat desde Staff › Aeropuertos.','Airport coordinates are missing. Import airports.dat from Staff › Airports.'));return}
  if(holds(p.id).length>=3){toast(t('Máximo 3 rutas reservadas a la vez.','Maximum 3 held routes at a time.'));return}
  if(holds(p.id).some(r=>r.from===a&&r.to===b)){toast(t('Ya tienes esta ruta reservada.','You already hold this route.'));return}
  const ty=compat(nm,mask);if(!ty.length){toast(t('Ninguna aeronave de la flota alcanza esta distancia.','No fleet aircraft can fly this distance.'));return}

function routesView(port){const f=ui.rt,p=port?me():null;

  const q=s=>String(s||'').trim().toLowerCase(),qa=q(f.a),qb=q(f.b),mt=(c,x)=>!x||c.toLowerCase().includes(x)||apName(c).toLowerCase().includes(x);
  const bit=f.type?(Object.keys(BN).find(k=>BN[k]===f.type)):0;
  let D=[];for(const r of RT){if(!mt(r[0],qa)||!mt(r[1],qb))continue;if(bit&&!(r[2]&bit))continue;if(f.hub&&r[0]!==f.hub&&r[1]!==f.hub)continue;D.push({r,nm:dist(r[0],r[1])})}
  const unk=D.filter(x=>!x.nm).length;if(f.ok)D=D.filter(x=>x.nm);if(f.max)D=D.filter(x=>x.nm&&x.nm<=+f.max);

  <label style="flex-direction:row;align-items:center;gap:8px;align-self:end"><input id="rtf-ok" type="checkbox" name="ok" ${f.ok?'checked':''}> ${t('Solo con distancia','Only with distance')}</label></form>
  ${tbl([t('Ruta','Route'),t('Ciudades','Cities'),'>nm',t('Tiempo est.','Est. time'),t('Equipo habitual','Usual equipment'),''],rows.map(x=>{const r=x.r,eq=maskTypes(r[2]);return[rt(r[0],r[1]),esc(apName(r[0]))+' → '+esc(apName(r[1])),'>'+(x.nm?nf(x.nm):'—'),x.nm?fh(cmins(x.nm,'A20N')):'—',eq.length?eq.map(e=>pill(e)).join(' '):'<span class="muted">—</span>',
    S.session?btn(t('Reservar','Book'),'rte',r[0]+'|'+r[1]+'|'+r[2],x.nm?'pri sm':'sm'):`<a class="btn sm" href="#login">${t('Entrar','Log in')}</a>`]}),t('Ninguna ruta coincide.','No routes match.'))}

  ${unk?`<div class="legal">${nf(unk)} ${t('rutas de esta búsqueda aún no tienen distancia porque faltan coordenadas de aeropuertos. Un administrador puede importar el airports.dat de OpenFlights en Staff › Aeropuertos.','routes in this search have no distance yet because airport coordinates are missing. An admin can import OpenFlights airports.dat in Staff › Airports.')}</div>`:''}`}

function readImg(file){return new Promise(res=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.78))};im.onerror=()=>res(null);im.src=fr.result};fr.onerror=()=>res(null);fr.readAsDataURL(file)})}

function readPng(file,maxW){return new Promise(res=>{if(!file||(file.type!=='image/png'&&!/\.png$/i.test(file.name)))return res(null);const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,maxW/im.width),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/png'))};im.onerror=()=>res(null);im.src=fr.result};fr.onerror=()=>res(null);fr.readAsDataURL(file)})}

 rsv:id=>openReserve(id),
 favr:id=>{const p=me();p.fav=p.fav.includes(id)?p.fav.filter(x=>x!==id):[...p.fav,id];done()},
 case:id=>{ui.case=id;go('p-caso')},
 ofp:id=>{const[i,d]=id.split(':'),r=R_(i);r.simbrief={id:'OFP-'+(hs(i)%90000+10000),fuel:Math.round(r.nm*11+1500),disc:d==='1'};rlog(r,t('OFP de SimBrief importado','SimBrief OFP imported')+(d==='1'?t(' con discrepancias (marcadas y notificadas)',' with discrepancies (flagged and notified)'):''));if(d==='1')notify(r.pilot,t('Discrepancias en tu OFP de ','Discrepancies in your OFP for ')+r.no);done()},
 checkin:id=>{const r=R_(id);r.status='checkedin';r.checkin=Date.now();rlog(r,t('Check-in completado','Check-in completed'));done()},
 conn:id=>{const r=R_(id);r.status='flying';r.flyTs=Date.now();r.checkin=r.checkin||Date.now();rlog(r,t('Actividad en '+r.platform+' coincidente: auto check-in y seguimiento iniciado','Matching '+r.platform+' activity: auto check-in and tracking started'));done()},
 plat:id=>{const r=R_(id);r.platform=r.platform==='VATSIM'?'IVAO':'VATSIM';rlog(r,t('Plataforma cambiada a ','Platform changed to ')+r.platform);done()},
 cancel:id=>{cancelRes(R_(id));ui.case=null;save();go('p-reservas');toast(t('Reserva cancelada','Booking cancelled'))},
 copy:id=>{const f=()=>toast(t('Copia manualmente: ','Copy manually: ')+id);try{navigator.clipboard.writeText(id).then(()=>toast(t('Remark copiado','Remark copied')),f)}catch(e){f()}},
 edit:()=>{ui.edit=!ui.edit;render()},
 wid:(id,el)=>{const pr=S.prefs[S.session.id]=S.prefs[S.session.id]||{hid:[]};pr.hid=el.checked?pr.hid.filter(x=>x!==id):[...pr.hid,id];save();render()},
 rk:id=>{ui.rk=id;render()},ctab:id=>{ui.ctab=id;render()},tk:id=>{ui.tk=id;render()},
 cert:id=>{const x=TOURS.find(q=>q.id===id),p=me(),g=tourProg(x,p.id),d=g.st[g.st.length-1].depTs;modal(t('Certificado','Certificate'),`<div class="cert"><span class="mono muted">NEXORA AIR VA · NXR</span><h2>${t('Certificado de Tour','Tour Certificate')}</h2><p>${t('Se certifica que','This certifies that')}</p><h1>${esc(p.name)}</h1><p>${p.id} · ${t('ha completado el tour','has completed the tour')}</p><h2 style="color:var(--brand)">${esc(x.n)}</h2><p class="muted">${fd(d)} · ID CERT-${(hs(p.id+x.id)%1e8).toString(36).toUpperCase()}</p><p class="muted" style="font-size:.75rem">${LEGAL()}</p></div>`)},
 enrol:id=>{const p=me();(S.enroll[p.id]=S.enroll[p.id]||{})[id]=Date.now();done(t('Inscrito en el tour','Enrolled in the tour'))},
 evjoin:id=>{S.events.find(e=>e.id===id).part[S.session.id]=[];done(t('Inscrito en el evento','Joined the event'))},
 evlink:id=>{const[e,l]=id.split(':');S.events.find(x=>x.id===e).part[S.session.id].push(l);settle();done(t('Vuelo vinculado','Flight linked'))},
 acc:id=>{S.accept.push({pid:S.session.id,doc:id,v:S.docs[id].v,ts:Date.now()});done(t('Aceptación registrada','Acceptance recorded'))},
 revreq:()=>{S.revReq.push(S.session.id);done(t('Revisión solicitada','Review requested'))},
 bgo:h=>{modal();go(h)},
 bell:()=>{const p=me(),l=S.notes.filter(n=>n.to===p.id).slice().reverse().slice(0,20);l.forEach(n=>n.read=true);save();modal(t('Notificaciones','Notifications'),`<div class="list">${l.map(n=>`<div><span>${esc(S.lang==='en'&&n.en?n.en:n.text)}</span><span class="muted">${n.go&&can(SPERM[n.go])?btn(t('Revisar','Review'),'bgo',n.go,'sm')+' ':''}${fd(n.ts)}</span></div>`).join('')||`<div class="empty">—</div>`}</div><p class="muted pad">${t('Cada notificación también se envía al email verificado.','Each notification is also emailed to the verified address.')}</p>`);render()},
 pdf:()=>{const p=me(),s=stats(p.id),L=S.log.filter(e=>e.pilot===p.id&&e.status==='Completado').sort((a,b)=>a.depTs-b.depTs);modal(t('Historial global (vista previa del PDF)','Global history (PDF preview)'),`<div class="pad stack"><p class="mono">NEXORA AIR VA · ID DOC NXR-H-${(hs(p.id+L.length)%1e8).toString(36).toUpperCase()} · ${fdt(Date.now())}</p><p><b>${esc(p.name)}</b> · ${p.id} · ${s.rank.n}</p>${tbl([t('Fecha','Date'),t('Vuelo','Flight'),t('Ruta','Route'),t('Red','Net')],L.slice(-12).map(e=>[fd(e.depTs),e.no,e.from+'→'+e.to,e.platform]))}<p><b>${t('Totales','Totals')}:</b> ${s.fl} ${t('vuelos','flights')} · ${nd(s.h)} h · ${nf(s.nm)} nm</p><p class="muted">${t('La exportación real a PDF llegará con el backend.','Real PDF export arrives with the backend.')}</p></div>`)},
 ap:id=>{const p=P_(id);p.status=p.status==='Pending'?'Active':p.status;p.netOk=true;notify(id,t('Tu cuenta y plataforma han sido aprobadas.','Your account and platform were approved.'));aud('Aprobó alta/plataforma',id);done()},
 rj:id=>{const p=P_(id);if(!p)return;modal(t('Rechazar solicitud','Reject request'),`<form data-f="drj" data-id="${esc(id)}" class="form pad"><p class="full">${t('Se eliminará la solicitud de','The request from')} <b>${esc(p.name)}</b> (${esc(p.id)}) ${t('y tendrá que volver a darse de alta si quiere entrar.','will be deleted and they will have to sign up again to join.')}</p><div class="full"><button class="btn bad" type="submit">${t('Rechazar y eliminar','Reject and delete')}</button> ${btn(t('Cancelar','Cancel'),'xm','','')}</div></form>`)},
 react:id=>{const p=P_(id);p.status='Active';delete p.susp;S.revReq=S.revReq.filter(x=>x!==id);notify(id,t('Tu suspensión ha finalizado y tu cuenta está reactivada.','Your suspension ended and your account is reactivated.'));aud('Reactivó cuenta',id);done()},
 susp:id=>modal(t('Suspender','Suspend'),`<form data-f="dsusp" data-id="${id}" class="form pad">${ta('dsusp','r',t('Motivo (obligatorio, visible para el piloto)','Reason (required, visible to pilot)'),'','required maxlength="200"')}${fld('dsusp','u',t('Fin de la suspensión','Suspension end'),'date','required')}<div class="full"><button class="btn bad" type="submit">${t('Suspender','Suspend')}</button></div></form>`),
 ptsm:id=>modal(t('Ajustar puntos','Adjust points'),`<form data-f="dpts" data-id="${id}" class="form pad">${fld('dpts','n',t('Puntos (negativo para retirar)','Points (negative to withdraw)'),'number','required min="-5000" max="5000"')}${fld('dpts','r',t('Motivo','Reason'),'text','required maxlength="100"')}<div class="full"><button class="btn pri" type="submit">${t('Aplicar','Apply')}</button></div></form>`),
 bdg:id=>modal(t('Conceder logro','Award badge'),`<form data-f="dbdg" data-id="${id}" class="form pad">${sel('dbdg','b',t('Logro','Badge'),STAFFB)}<div class="full"><button class="btn pri" type="submit">${t('Conceder','Award')}</button></div></form>`),
 deluser:id=>{purgePilot(id);aud('Eliminó la cuenta',id);done(t('Cuenta eliminada','Account deleted'))},
 blk:id=>{const f=S.flights.find(x=>x.no===id);f.blocked=!f.blocked;aud(f.blocked?'Bloqueó vuelo':'Desbloqueó vuelo','NXR'+id);done()},
 vap:id=>{const e=S.log.find(x=>x.id===id),b=rankOf(stats(e.pilot).h).i;validated(S.res.find(r=>r.entryId===id),e,b);aud('Aprobó vuelo en revisión',e.no+' '+e.pilot);done(t('Vuelo validado','Flight validated'))},
 vrj:id=>{const e=S.log.find(x=>x.id===id);aud('Rechazó vuelo en revisión',e.no+' '+e.pilot);rejectEntry(e);done(t('Vuelo rechazado y efectos revertidos','Flight rejected, effects reverted'))},
 ireo:id=>{const i=S.inc.find(x=>x.id===id);i.st='Reabierta';i.deadline=Date.now()+48*H;i.responded=false;i.r24=0;notify(i.pilot,t('Incidente reabierto: tienes 48 h para responder.','Incident reopened: you have 48 h to respond.'));aud('Reabrió incidente',id);done()},
 ires:id=>{const i=S.inc.find(x=>x.id===id);S.inc=S.inc.filter(x=>x.id!==id);notify(i.pilot,t('Incidente resuelto y eliminado.','Incident resolved and removed.'));aud('Resolvió incidente',id);done(t('Incidente resuelto','Incident resolved'))},
 tkc:id=>{const k=S.tickets.find(x=>x.id===id);k.st='Closed';k.msgs=[];notify(k.pilot,t('Ticket cerrado: ','Ticket closed: ')+id);done()},
 rcode:id=>modal(t('Código de ruta','Route code'),`<form data-f="dcode" data-id="${id}" class="form pad">${fld('dcode','c',t('Código','Code'),'text','required maxlength="14"',rcode(id.slice(0,4),id.slice(4)))}<div class="full"><button class="btn pri" type="submit">${t('Guardar','Save')}</button></div></form>`),
 chk:id=>{const x=S.intg.find(q=>q.n===id);x.ts=Date.now();x.st='Operativa';aud('Comprobó integración',id);done(t('Integración operativa','Integration operational'))},
 maint:()=>{S.maint=!S.maint;aud(S.maint?'Activó mantenimiento':'Desactivó mantenimiento');done()}};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a;if(!A[a])return;if(el.tagName==='A'&&a!=='xm')return;A[a](el.dataset.id,el,e)});

/* ===== forms ===== */
const err=(id,m)=>{const e=$('#'+id);if(e){e.textContent=m;e.hidden=false}return m};
const DANG=['exe','bat','cmd','com','scr','js','vbs','msi','ps1','jar','sh','dll'];
const F={
 hero:d=>{ui.fl.from=d.get('from');ui.fl.to=d.get('to');go(S.session?'p-vuelos':'operaciones')},
 flt:d=>{['from','to','type','hub','band','dur','tour','seats','state','sort'].forEach(k=>ui.fl[k]=d.get(k)||'');render()},
 reg:async d=>{const u=d.get('user').trim(),pl=d.get('platform'),id=pl==='VATSIM'?d.get('vatsim'):d.get('ivao');
  if(S.pilots.some(p=>p.user.toLowerCase()===u.toLowerCase()))return err('reg-err',t('Ese usuario ya existe.','That username already exists.'));
  if(!id)return err('reg-err',t('Indica tu ID de ','Enter your ')+pl+t('.',' ID.'));
  const p={id:nextPid(),name:d.get('name').trim(),country:d.get('country').toUpperCase(),user:u,email:d.get('email'),pass:await hp(d.get('pass')),platform:pl,vatsim:d.get('vatsim')||'',ivao:d.get('ivao')||'',simbrief:d.get('simbrief'),netOk:false,hub:'LEMD',status:'Pending',joined:Date.now(),fav:[],favT:[],badges:[]};
  S.pilots.push(p);aud('Nueva solicitud de alta',p.id);notifyStaff('pilotos','Nueva alta pendiente de revisión: '+p.name+' ('+p.id+')','New sign-up pending review: '+p.name+' ('+p.id+')','s-pilotos');save();go('login');toast(t('Solicitud enviada. SimBrief verificado; el staff revisará tu plataforma.','Request sent. SimBrief verified; staff will review your platform.'))},
 login:async d=>{const u=d.get('user').trim().toLowerCase(),k=S.att[u]||{n:0,until:0};
  if(k.until>Date.now())return err('login-err',t('Acceso bloqueado temporalmente. Inténtalo más tarde.','Access temporarily locked. Try again later.'));
  const p=S.pilots.find(x=>x.user.toLowerCase()===u),h=await hp(d.get('pass'));
  if(!p||!p.pass||p.pass!==h){k.n++;if(k.n>=5){k.until=Date.now()+10*MIN;k.n=0;S.sec.push({ts:Date.now(),txt:t('Bloqueo temporal por intentos fallidos: ','Temporary lock after failed attempts: ')+u,sev:'alta'})}S.att[u]=k;save();return err('login-err',t('Usuario o contraseña incorrectos. Las cuentas de ejemplo entran con los botones de demo.','Wrong username or password. Sample accounts log in with the demo buttons.'))}
  S.att[u]={n:0,until:0};S.session={id:p.id,staff:isStaff(p)};save();go(isStaff(p)?'s-dash':'portal')},
 rsv:(d,f)=>{const m=doReserve(f.dataset.id,d.get('platform'),!!d.get('imm'));if(typeof m==='string'){toast(m);return}modal();save();go('p-caso');toast(t('Reserva confirmada. Caso operacional abierto.','Booking confirmed. Operational case opened.'))},
 fin:(d,f)=>{const r=R_(f.dataset.id),e=finalize(r,d.get('plat'),d.get('out'));done(e.status==='Completado'?t('Vuelo validado y añadido al Logbook','Flight validated and added to Logbook'):t('Vuelo en revisión','Flight under review'))},
 just:(d,f)=>{S.log.find(e=>e.id===f.dataset.id).just=d.get('t');done(t('Justificación enviada al staff','Explanation sent to staff'))},
 free:d=>{const a=d.get('from'),b=d.get('to'),ty=d.get('type');if(a===b)return err('free-err',t('Origen y destino deben ser distintos.','Origin and destination must differ.'));const nm=dist(a,b);
  if(nm>TYPES[ty].r*.9)return err('free-err',t('Esa aeronave no alcanza esa distancia (','That aircraft cannot fly ')+nf(nm)+' nm).');
  const p=me(),r={id:uid('R'),pilot:p.id,kind:'free',no:'FREE',instId:null,from:a,to:b,type:ty,depTs:Date.now(),mins:cmins(nm,ty),nm,platform:d.get('plat'),status:'reserved',created:Date.now(),simbrief:null,checkin:null,session:'S-'+(hs(a+b+Date.now())%1e6).toString(36).toUpperCase(),log:[{ts:Date.now(),text:t('Free Flight creado','Free Flight created')}]};
  S.res.push(r);ui.case=r.id;save();go('p-caso')},
 prof:d=>{const p=me();p.name=d.get('name');p.email=d.get('email');p.platform=d.get('platform');p.hub=d.get('hub');p.favT=d.getAll('ft');done(t('Perfil guardado','Profile saved'))},
 pw:async d=>{const p=me(),h=await hp(d.get('new'));if(p.pass===h)return err('pw-err',t('No puedes reutilizar la contraseña actual.','You cannot reuse the current password.'));p.pass=h;S.session=null;save();go('login');toast(t('Contraseña cambiada; se cerraron todas las sesiones.','Password changed; all sessions were closed.'))},
 del:async d=>{const p=me();if(p.pass&&p.pass!==await hp(d.get('pass')))return err('del-err',t('Contraseña incorrecta.','Wrong password.'));S.delReq.push(p.id);done(t('Solicitud enviada al administrador','Request sent to the administrator'))},
 tkn:(d,f)=>{const fs=[...f.querySelector('input[type=file]').files];if(fs.length>3)return err('tkn-err',t('Máximo 3 archivos por ticket.','Max 3 files per ticket.'));
  for(const x of fs){if(x.size>25*1048576)return err('tkn-err',x.name+t(': supera 25 MB.',': exceeds 25 MB.'));if(DANG.includes(x.name.split('.').pop().toLowerCase()))return err('tkn-err',x.name+t(': archivo bloqueado por seguridad. Quítalo e inténtalo de nuevo.',': blocked for security. Remove it and try again.'))}
  const n=Math.max(0,...S.tickets.map(k=>+k.id.slice(2)))+1;S.tickets.push({id:'T-'+String(n).padStart(4,'0'),pilot:S.session.id,subject:d.get('s'),st:'Open',last:Date.now(),msgs:[{from:'pilot',text:d.get('t'),ts:Date.now(),files:fs.map(x=>x.name)}]});ui.tk='T-'+String(n).padStart(4,'0');done(t('Ticket creado','Ticket created'))},
 tkr:(d,f)=>{const k=S.tickets.find(x=>x.id===f.dataset.id);k.msgs.push({from:'pilot',text:d.get('t'),ts:Date.now(),files:[]});k.last=Date.now();done(t('Respuesta enviada','Reply sent'))},
 tks:(d,f)=>{const k=S.tickets.find(x=>x.id===f.dataset.id);k.msgs.push({from:'staff',text:d.get('t'),ts:Date.now(),files:[]});k.last=Date.now();k.st='In process';notify(k.pilot,t('Respuesta del staff en el ticket ','Staff reply on ticket ')+k.id);done(t('Respuesta enviada','Reply sent'))},
 inc:(d,f)=>{const i=S.inc.find(x=>x.id===f.dataset.id);i.msgs.push({from:me().name,text:d.get('t')});i.responded=true;i.st='En revisión';done(t('Respuesta enviada','Response sent'))},
 ninc:d=>{const pid=d.get('pid');if(S.inc.some(i=>i.pilot===pid))return err('ninc-err',t('Ese piloto ya tiene un incidente abierto.','That pilot already has an open incident.'));const Y=new Date().getUTCFullYear(),n=(S.incSeq[Y]||0)+1;S.incSeq[Y]=n;
  const id='NXR-INC-'+Y+'-'+String(n).padStart(n>999999?7:6,'0');S.inc.push({id,pilot:pid,subject:d.get('s'),detail:d.get('d'),st:'Abierta',created:Date.now(),deadline:Date.now()+48*H,responded:false,msgs:[]});notify(pid,t('Nuevo incidente ','New incident ')+id+t(': tienes 48 h para responder.',': you have 48 h to respond.'));aud('Abrió incidente',id);done(t('Incidente abierto','Incident opened'))},
 nfl:d=>{const a=d.get('from'),b=d.get('to'),ty=d.get('type');if(a===b)return err('nfl-err',t('Origen y destino deben ser distintos.','Origin and destination must differ.'));if(dist(a,b)>TYPES[ty].r*.9)return err('nfl-err',t('La aeronave no alcanza esa distancia.','The aircraft cannot fly that distance.'));
  const no=String(Math.max(...S.flights.map(f=>+f.no))+1);S.flights.push({no,from:a,to:b,m:d.get('m'),type:ty,slots:+d.get('slots'),blocked:false});aud('Creó vuelo','NXR'+no);done(t('Vuelo NXR','Flight NXR')+no+t(' creado',' created'))},
 nac:d=>{const reg=d.get('reg').toUpperCase();if(S.fleet.some(a=>a.reg===reg))return err('nac-err',t('Esa matrícula ya existe.','That registration already exists.'));S.fleet.push({reg,type:d.get('type'),name:d.get('name')});aud('Añadió aeronave',reg);done(reg+t(' añadida',' added'))},
 nap:d=>{const k=d.get('icao').toUpperCase();if(S.ap[k])return err('nap-err',t('Ese ICAO ya existe.','That ICAO already exists.'));S.ap[k]=[d.get('iata').toUpperCase(),d.get('city'),d.get('k').toUpperCase(),+d.get('lat'),+d.get('lon'),d.get('tz'),'',d.get('city')];rebuildIx();aud('Añadió aeropuerto',k);done(k+t(' añadido',' added'))},
 nev:d=>{const s=Date.parse(d.get('s'));S.events.push({id:uid('ev'),n:d.get('n'),d:d.get('d'),s,e:s+4*H,x:+d.get('x'),badge:'',part:{}});aud('Creó evento',d.get('n'));done(t('Evento creado','Event created'))},
 ncal:d=>{S.cal.push({id:uid('c'),type:d.get('k'),n:d.get('n'),ts:Date.parse(d.get('s'))});aud('Añadió al calendario',d.get('n'));done(t('Añadido','Added'))},
 rem:d=>{Object.keys(S.remarks).forEach(k=>S.remarks[k]=d.get(k));aud('Actualizó remarks');done(t('Remarks guardados','Remarks saved'))},
 nnw:d=>{S.news.push({id:uid('n'),n:d.get('n'),b:d.get('b'),aud:d.get('aud'),ts:Date.now(),rel:d.get('rel')?1:0});aud('Publicó noticia',d.get('n'));done(t('Publicado','Published'))},
 ngr:d=>{S.groups.push({n:d.get('n'),m:d.getAll('m')});aud('Creó grupo',d.get('n'));done(t('Grupo creado','Group created'))},
 ndoc:d=>{const k=d.get('d'),v=(parseFloat(S.docs[k].v)+.1).toFixed(1);S.docs[k]={v,ts:Date.now(),text:d.get('x')};S.pilots.filter(p=>p.status!=='Pending').forEach(p=>notify(p.id,t('Nueva versión publicada: ','New version published: ')+t(...DOCN[k])+' v'+v));aud('Publicó '+DOCN[k][0],'v'+v);done(t('Versión publicada: los pilotos deben aceptarla','Version published: pilots must accept it'))},
 dsusp:(d,f)=>{const p=P_(f.dataset.id);p.status='Suspended';p.susp={reason:d.get('r'),until:Date.parse(d.get('u')),ended:false};S.res.filter(r=>r.pilot===p.id&&ACTIVE.includes(r.status)).forEach(r=>cancelRes(r,t('Cancelada por suspensión','Cancelled by suspension')));notify(p.id,t('Cuenta suspendida: ','Account suspended: ')+d.get('r'));aud('Suspendió piloto',p.id);done()},
 dpts:(d,f)=>{const p=P_(f.dataset.id);S.tx.push({id:uid('X'),pilot:p.id,pts:+d.get('n'),xp:0,why:t('Ajuste manual: ','Manual adjustment: ')+d.get('r'),ref:'manual',ts:Date.now()});notify(p.id,t('Ajuste de puntos: ','Points adjustment: ')+d.get('n'));aud('Ajustó puntos',p.id+' '+d.get('n'));done()},
 dbdg:(d,f)=>{const p=P_(f.dataset.id);if(!p.badges.includes(d.get('b')))p.badges.push(d.get('b'));notify(p.id,t('Logro concedido: ','Badge awarded: ')+d.get('b'));aud('Concedió logro',p.id);done()},
 dcode:(d,f)=>{S.routeCodes[f.dataset.id]=d.get('c');aud('Cambió código de ruta',f.dataset.id);done()}};
F.drj=(d,f)=>{const id=f.dataset.id;purgePilot(id);aud('Rechazó solicitud',id);done(t('Solicitud rechazada. Tendrá que volver a registrarse.','Request rejected. They will have to sign up again.'))};
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-f]');if(!f)return;e.preventDefault();const h=F[f.dataset.f];if(h)h(new FormData(f),f)});

/* ===== routes, charter, fleet and tour builder actions ===== */
Object.assign(A,{
 rtreset:async()=>{try{localStorage.removeItem('nexora-va-rt')}catch(e){}await loadData();toast(t('Catálogo del sitio restaurado','Site catalogue restored'))},
 rte:id=>{const[a,b,m]=id.split('|');openRoute(a,b,+m)},

/* ===== acciones de cuenta en modo nube (Supabase Auth) ===== */
function cloudHook(){if(!CL.on)return;
  const afterAuth=async()=>{const u=(await CL.sb.auth.getUser()).data.user;CL.uid=u?u.id:null;CL.email=u?u.email:'';await cloudPull()};
  const old={logout:A.logout,del:F.del};
  F.login=async d=>{const r=await CL.sb.auth.signInWithPassword({email:d.get('user').trim().toLowerCase(),password:d.get('pass')});
    if(r.error)return err('login-err',t('Correo o contraseña incorrectos. Si tu solicitud fue rechazada, vuelve a registrarte.','Wrong email or password. If your request was rejected, sign up again.'));
    await afterAuth();const p=me();if(!p)return err('login-err',t('Tu perfil aún no existe. Inténtalo de nuevo.','Your profile does not exist yet. Try again.'));go(isStaff(p)?'s-dash':'portal')};
  F.reg=async d=>{const pl=d.get('platform'),id=pl==='VATSIM'?d.get('vatsim'):d.get('ivao');if(!id)return err('reg-err',t('Indica tu ID de ','Enter your ')+pl+t('.',' ID.'));
    if((d.get('pass')||'').length<8)return err('reg-err',t('La contraseña debe tener al menos 8 caracteres.','Password must be at least 8 characters.'));
    const r=await CL.sb.auth.signUp({email:d.get('email').trim().toLowerCase(),password:d.get('pass'),options:{data:{name:d.get('name').trim(),country:(d.get('country')||'').toUpperCase(),user:d.get('user').trim(),platform:pl,vatsim:d.get('vatsim')||'',ivao:d.get('ivao')||'',simbrief:d.get('simbrief')||''}}});
    if(r.error)return err('reg-err',r.error.message);
    if(r.data.session){await afterAuth();go(isStaff(me())?'s-dash':'portal');toast(t('Cuenta creada. El staff revisará tu plataforma.','Account created. Staff will review your platform.'))}
    else{go('login');toast(t('Revisa tu correo para confirmar la cuenta.','Check your email to confirm the account.'))}};
  A.logout=async()=>{await CL.sb.auth.signOut();CL.uid=null;CL.email='';await cloudPull();go('inicio')};
  F.pw=async d=>{const r=await CL.sb.auth.updateUser({password:d.get('new')});if(r.error)return err('pw-err',r.error.message);await CL.sb.auth.signOut();CL.uid=null;await cloudPull();go('login');toast(t('Contraseña cambiada. Vuelve a entrar.','Password changed. Log in again.'))};
  F.del=async d=>{const r=await CL.sb.auth.signInWithPassword({email:CL.email,password:d.get('pass')});if(r.error)return err('del-err',t('Contraseña incorrecta.','Wrong password.'));return old.del(d)};
  /* rechazar una alta o eliminar una cuenta: se borra de verdad en Supabase (perfil, datos y usuario de acceso) */
  const rm=async(id,msg,audTxt)=>{const p=P_(id);if(!p||!p.uid)return;const r=await CL.sb.rpc('remove_pilot',{p_uid:p.uid});
    if(r.error){toast(t('No se pudo eliminar: ','Could not remove: ')+r.error.message);return}
    await cloudPull();aud(audTxt,id);save();modal();render();toast(msg)};
  F.drj=(d,f)=>rm(f.dataset.id,t('Solicitud rechazada. Tendrá que volver a registrarse.','Request rejected. They will have to sign up again.'),'Rechazó solicitud');
  A.deluser=id=>rm(id,t('Cuenta eliminada','Account deleted'),'Eliminó la cuenta');
  A.demo=()=>toast(t('Las cuentas de demostración no existen en modo nube.','Demo accounts do not exist in cloud mode.'))}
/* ===== acciones: ficha de piloto, cambio de ID, búsqueda ===== */
Object.assign(A,{
 pfile:id=>{if(!can('pilotos'))return;const f=pilotFile(id);if(f)modal(f[0],f[1],1)},
 psclr:()=>{ui.ps='';render()}
});
Object.assign(F,{
 psq:d=>{ui.ps=(d.get('q')||'').trim();render()},
 pid:async(d,f)=>{if(!can('pilotos'))return;const old=f.dataset.id,p=P_(old),c=pidCheck(d.get('nid'),old);if(!p)return;if(c.err)return err('pid-err',c.err);if(c.id===old){modal();return}
   if(CL.on){const r=await CL.sb.from('profiles').update({code:c.id}).eq('id',p.uid);
     if(r.error)return err('pid-err',/duplicate|unique/i.test(r.error.message)?t('Ese ID ya lo usa otro piloto.','That ID is already used by another pilot.'):r.error.message);
     CL.psnap[c.id]=CL.psnap[old];delete CL.psnap[old]}
   renamePid(old,c.id);notify(c.id,t('Tu ID de piloto es ahora ','Your pilot ID is now ')+c.id);aud('Cambió el ID de piloto',old+' → '+c.id);
   save();render();toast(t('ID actualizado: ','ID updated: ')+c.id);A.pfile(c.id)},
 phrs:(d,f)=>{if(!isAdmin(me()))return;const id=f.dataset.id,p=P_(id);if(!p)return;
   const tot=parseFloat(String(d.get('h')).replace(',','.')),why=(d.get('why')||'').trim();
   if(!isFinite(tot)||tot<0||tot>99999)return err('phrs-err',t('Indica unas horas entre 0 y 99999.','Enter hours between 0 and 99999.'));
   if(!why)return err('phrs-err',t('Indica el motivo del ajuste.','Enter the reason for the adjustment.'));
   const s0=stats(id),r0=rankOf(s0.h);p.hAdj=Math.round((tot-s0.hl)*100)/100;if(!p.hAdj)delete p.hAdj;const s1=stats(id);
   if(Math.abs(s1.h-s0.h)<0.005){modal();return}
   notify(id,t('El staff ha ajustado tus horas de vuelo: ','Staff adjusted your flight hours: ')+nd(s0.h)+' → '+nd(s1.h)+' h.');const r1=rankOf(s1.h);if(r1.i>r0.i)notify(id,t('¡Ascenso a ','Promoted to ')+r1.n+'!');
   aud('Ajustó las horas de vuelo',id+': '+nd(s0.h)+' → '+nd(s1.h)+' h · '+why);save();render();toast(t('Horas actualizadas','Hours updated'));A.pfile(id)},
 pdata:(d,f)=>{if(!isAdmin(me()))return;const id=f.dataset.id,p=P_(id);if(!p)return;const g=k=>(d.get(k)||'').trim();
   const v={name:g('name'),country:g('country').toUpperCase(),user:g('user'),platform:g('platform')==='IVAO'?'IVAO':'VATSIM',vatsim:g('vatsim'),ivao:g('ivao'),simbrief:g('simbrief'),hub:g('hub')||p.hub,netOk:d.get('netOk')==='1'};
   if(!v.name)return err('pdata-err',t('Indica el nombre.','Enter the name.'));
   if(!/^[A-Z]{2}$/.test(v.country))return err('pdata-err',t('El país son 2 letras (ES, MX…).','Country is 2 letters (ES, MX…).'));
   if(!/^[A-Za-z0-9_]{3,40}$/.test(v.user))return err('pdata-err',t('Usuario: 3 a 40 letras, números o _.','Username: 3 to 40 letters, digits or _.'));
   if(!CL.on&&S.pilots.some(x=>x.id!==id&&(x.user||'').toLowerCase()===v.user.toLowerCase()))return err('pdata-err',t('Ese usuario ya existe.','That username already exists.'));
   for(const k of ['vatsim','ivao','simbrief'])if(v[k]&&!/^\d{5,8}$/.test(v[k]))return err('pdata-err',t('Los ID de red y de SimBrief son de 5 a 8 cifras.','Network and SimBrief IDs are 5 to 8 digits.'));
   if(!v[v.platform==='VATSIM'?'vatsim':'ivao'])return err('pdata-err',t('Indica el ID de la plataforma preferida.','Enter the ID of the preferred platform.'));
   if(!CL.on){const em=g('email');if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em))return err('pdata-err',t('Correo no válido.','Invalid email.'));v.email=em}
   if(d.has('status'))v.status=g('status');
   const rol=d.has('rol')?(g('rol')||null):p.rol;
   if(isAdmin(p)&&rol!=='admin'&&S.pilots.filter(isAdmin).length<2)return err('pdata-err',t('Debe quedar al menos un administrador.','At least one administrator must remain.'));
   const ch=[];Object.keys(v).forEach(k=>{if(v[k]!==p[k]&&!(v[k]===''&&p[k]===undefined)){ch.push(k);p[k]=v[k]}});
   if(rol!==(p.rol||null)){ch.push('rol');p.rol=rol;notify(p.id,rol?t('Se te ha asignado el nivel de staff: ','You were given the staff level: ')+(rol==='admin'?'Admin':(roleOf(p)||{n:'?'}).n):t('Tu acceso de staff ha sido retirado.','Your staff access was removed.'))}
   if(!ch.length){modal();return}
   if(S.session&&S.session.id===id)S.session.staff=isStaff(p);
   aud('Editó los datos del piloto',id+' ('+ch.join(', ')+')');save();render();toast(t('Datos guardados','Data saved'));A.pfile(id)}
});

(async()=>{
  const cloud=await cloudStart();
  if(!cloud){S=load()||{};if(!S.v)seed()}
  TOURS=S.tours;rebuildIx();ensure();cloudHook();
  render();loadData();
})();
