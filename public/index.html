<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><script src="config.js"></script></head><body>
<title>NEXORA AIR</title>
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('nexora-theme')==='light'?'light':'dark')}catch(e){document.documentElement.setAttribute('data-theme','dark')}</script>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Concept: modern airline site built from the NEXORA livery board. Cloud-white ground, floating glass header, photographic hero in deep green, soft rounded cards. Lime appears only on dark green or as small accents. */
:root{
  --bg:#F4F6F8; --surface:#fff; --surface2:#EBF0F3; --fg:#0F1F19; --muted:#5A6B74; --line:#DCE3E8;
  --brand:#0B5E3B; --brand2:#094A2F; --brand-fg:#fff; --lime:#7ED321; --lime-ink:#4E9A0E; --gray:#9AA4B2; --soft:#E0F0E7; --hero:#073B26;
  --good:#1B7F3C; --good-s:#DFF2E3; --warn:#8A5A00; --warn-s:#FBEBCB; --bad:#B3261E; --bad-s:#FBE0DD;
  --glass:rgba(255,255,255,.78); --shadow:0 1px 2px rgba(10,40,28,.05),0 8px 24px -12px rgba(10,40,28,.18);
  --display:'Space Grotesk',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08110D; --surface:#0F1D17; --surface2:#15261E; --fg:#E7F0EB; --muted:#92A69B; --line:#21362B;
  --brand:#7ED321; --brand2:#6BBE16; --brand-fg:#08200F; --lime-ink:#7ED321; --soft:#143321; --hero:#07281B;
  --good:#62D17F; --good-s:#143221; --warn:#E8B04A; --warn-s:#3A2E12; --bad:#F08A82; --bad-s:#3F1D1B;
  --glass:rgba(15,29,23,.78); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08110D; --surface:#0F1D17; --surface2:#15261E; --fg:#E7F0EB; --muted:#92A69B; --line:#21362B;
  --brand:#7ED321; --brand2:#6BBE16; --brand-fg:#08200F; --lime-ink:#7ED321; --soft:#143321; --hero:#07281B;
  --good:#62D17F; --good-s:#143221; --warn:#E8B04A; --warn-s:#3A2E12; --bad:#F08A82; --bad-s:#3F1D1B;
  --glass:rgba(15,29,23,.78); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:1.85rem;line-height:1.1}h2{font-size:1.05rem}h3{font-size:.97rem}p{margin:0}
a{color:var(--brand)}.mono{font-family:var(--mono);font-size:.92em}.muted{color:var(--muted)}.nw{white-space:nowrap}
.wrap{max-width:1200px;margin:0 auto;min-width:0}
.top{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:9;margin-top:8px;display:flex;align-items:center;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;padding:8px 10px 8px 16px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg)}
.brand .wm{font-family:var(--display);font-weight:700;font-size:1.2rem;letter-spacing:.01em;line-height:1}.brand .wm i{font-style:normal;color:var(--lime-ink)}
.brand small{font-family:var(--mono);font-size:.64rem;color:var(--muted);letter-spacing:.06em;border-left:1px solid var(--line);padding-left:10px}
#intro{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;background:#020b07;overflow:hidden;transition:opacity .6s ease,transform .6s ease;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#intro.out{opacity:0;transform:scale(1.06);pointer-events:none}
#intro .in-bg{position:absolute;inset:-4%;background:linear-gradient(100deg,#020b07 18%,rgba(2,11,7,.2) 100%),url(img/hero-x.jpg) right center/cover;animation:inkb 22s ease-in-out infinite alternate}
@keyframes inkb{from{transform:scale(1) translate(0,0)}to{transform:scale(1.12) translate(-1.5%,1%)}}
#intro .in-cv{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen}
#intro .in-glow{position:absolute;width:60vmax;height:60vmax;left:-15vmax;top:50%;margin-top:-30vmax;background:radial-gradient(circle,rgba(126,211,33,.16),transparent 62%);animation:ingl 6s ease-in-out infinite alternate;pointer-events:none}
@keyframes ingl{from{opacity:.5;transform:scale(.9)}to{opacity:1;transform:scale(1.1)}}
#intro .in-box{position:relative;z-index:2;max-width:780px;padding:0 24px;display:flex;flex-direction:column;align-items:flex-start;gap:16px;transition:transform .25s ease-out}
@media (min-width:900px){#intro{justify-content:flex-start;padding-left:9vw}}
#intro .in-logo{height:84px;width:auto;max-width:100%;animation:inup .9s cubic-bezier(.2,.8,.2,1) both,infl 5s ease-in-out 1s infinite}
@keyframes infl{0%,100%{filter:drop-shadow(0 0 0 rgba(126,211,33,0))}50%{filter:drop-shadow(0 0 18px rgba(126,211,33,.45))}}
@keyframes inup{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
#intro .in-chip{font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;color:#9fc3ad;border:1px solid rgba(126,211,33,.35);padding:5px 12px;border-radius:99px;animation:inup .8s .15s cubic-bezier(.2,.8,.2,1) both}
#intro h1{font-family:var(--display);font-weight:800;font-size:clamp(2.7rem,8.4vw,5.6rem);line-height:1;margin:0;letter-spacing:-.02em}
#intro .in-w{display:inline-block;opacity:0;animation:inw .9s var(--d) cubic-bezier(.2,.9,.2,1) forwards}
#intro .in-w.w1{color:#7ED321;text-shadow:0 0 28px rgba(126,211,33,.55)}
#intro .in-w.w2{background:linear-gradient(90deg,#fff,#9EEB3C);-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes inw{from{opacity:0;transform:translateY(.55em) skewY(5deg);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
#intro .in-tag{font-size:clamp(1.1rem,2.8vw,1.55rem);font-weight:500;color:#e6f3ea;margin:0;min-height:1.6em;display:flex;align-items:center}
#intro .in-caret{display:inline-block;width:2px;height:1.2em;background:#7ED321;margin-left:3px;animation:inbl .8s steps(1) infinite}
#intro.typed .in-caret{animation:inbl 1.1s steps(1) infinite}
@keyframes inbl{50%{opacity:0}}
#intro .in-tick{font-size:.95rem;color:#9fc3ad;display:flex;gap:8px;flex-wrap:wrap;animation:inup .8s 2.6s both}
#intro .in-tk{color:#7ED321;transition:opacity .26s,transform .26s;display:inline-block}
#intro .in-tk.sw{opacity:0;transform:translateY(8px)}
#intro .in-cta{display:inline-flex;align-items:center;gap:10px;margin-top:8px;padding:13px 22px;border:1px solid rgba(126,211,33,.6);border-radius:99px;background:rgba(126,211,33,.12);font-weight:700;animation:inup .8s 3s both,incta 2.4s 3.8s ease-in-out infinite;backdrop-filter:blur(4px)}
@keyframes incta{0%,100%{box-shadow:0 0 0 0 rgba(126,211,33,.45)}50%{box-shadow:0 0 0 14px rgba(126,211,33,0)}}
#intro .in-dot{width:10px;height:10px;border-radius:50%;background:#7ED321}
#intro .in-arr{display:inline-block;animation:inar 1.2s ease-in-out infinite}
@keyframes inar{50%{transform:translateX(6px)}}
#intro .in-legal{font-size:.72rem;color:#7d9a8a;margin:6px 0 0;max-width:60ch;animation:inup .8s 3.2s both}
@media (prefers-reduced-motion:reduce){#intro *{animation:none!important;transition:none!important}#intro .in-w,#intro .in-tick,#intro .in-cta,#intro .in-legal{opacity:1}}
.btn.dis{opacity:.4;pointer-events:none}.doctext{white-space:pre-wrap;line-height:1.65;max-width:78ch}.docpdf{width:100%;height:70vh;min-height:420px;border:1px solid var(--line);border-radius:10px}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.nav a{white-space:nowrap;padding:7px 12px;border-radius:99px;color:var(--muted);text-decoration:none;font-weight:500}
.nav a:hover{color:var(--fg);background:var(--surface2)}.nav a[aria-current="page"]{color:var(--brand-fg);background:var(--brand)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hero{position:relative;overflow:hidden;border-radius:24px;margin-top:16px;color:#fff;background:var(--hero);padding:44px 36px 0;display:flex;flex-direction:column;gap:18px}
.hero .strip{margin:6px -36px 0;aspect-ratio:1536/258;background:linear-gradient(180deg,var(--hero) 0,rgba(7,59,38,0) 42%),url(img/livery.jpg) center/cover}
.hero h1{font-size:clamp(2.2rem,5.2vw,3.6rem);line-height:1.02;max-width:16ch}.hero .lime{color:var(--lime)}.hero p{max-width:50ch;color:#D8EBE0;font-size:1.02rem}
.hero .eyebrow{color:var(--lime)}
.search{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;background:rgba(255,255,255,.14);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.22);padding:12px;border-radius:16px;max-width:720px}
.search label{color:#E5F3EA;flex:1 1 150px}.search select,.search input{background:#fff;color:#0F1F19;border-color:transparent}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--lime-ink);font-weight:500}
.legal{background:var(--warn-s);color:var(--warn);border-radius:12px;padding:9px 16px;font-size:.8rem}
main{display:flex;flex-direction:column;gap:20px;padding-top:20px;min-width:0;animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px}.head p{color:var(--muted);max-width:64ch;margin-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;min-width:0;box-shadow:var(--shadow);overflow:hidden}
.card>header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:13px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pad{padding:18px}.stack{display:flex;flex-direction:column;gap:10px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr))}.grid>*{min-width:0}
.cols{display:grid;gap:18px;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
@media(max-width:820px){.cols{grid-template-columns:minmax(0,1fr)}.hero{padding:28px 20px 0}.hero .strip{margin:6px -20px 0}}
.shell{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;padding-top:18px}
.side{display:flex;flex-direction:column;gap:2px;align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px)}
.side h4{margin:14px 0 4px 10px;font-size:.66rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}.side h4:first-child{margin-top:0}
.side a{padding:7px 12px;border-radius:10px;color:var(--fg);text-decoration:none}
.side a:hover{background:var(--surface2)}.side a[aria-current="page"]{background:var(--brand);color:var(--brand-fg);font-weight:600}
@media(max-width:860px){.shell{grid-template-columns:minmax(0,1fr);gap:10px}.side{position:static;flex-direction:row;overflow-x:auto;gap:4px;align-items:center}.side h4{display:none}.side a{white-space:nowrap}}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.87rem}
th{font-size:.66rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600;text-align:left;padding:10px 16px;white-space:nowrap;background:var(--surface2)}
td{padding:11px 16px;border-top:1px solid var(--line);vertical-align:middle}
tbody tr:hover td{background:color-mix(in srgb,var(--soft) 45%,transparent)}
.num{text-align:right;font-variant-numeric:tabular-nums}tr.me td{background:var(--soft)}
.empty{padding:26px 16px;color:var(--muted);text-align:center}
.btn{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 14px;border-radius:10px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block;transition:transform .12s,border-color .12s,background .12s}
.btn:hover{border-color:var(--muted);transform:translateY(-1px)}
.btn.pri{background:linear-gradient(180deg,var(--brand),var(--brand2));border-color:var(--brand2);color:var(--brand-fg)}
.btn.lime{background:var(--lime);border-color:var(--lime);color:#0A1F10;font-weight:600}
.btn.ghost{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.55)}
.btn.good{color:var(--good);border-color:var(--good)}.btn.bad{color:var(--bad);border-color:var(--bad)}.btn.sm{padding:4px 11px;font-size:.8rem;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.pill{display:inline-block;font-size:.72rem;font-weight:600;border-radius:99px;padding:2px 10px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-s);color:var(--good)}.pill.warn{background:var(--warn-s);color:var(--warn)}.pill.bad{background:var(--bad-s);color:var(--bad)}.pill.acc{background:var(--soft);color:var(--brand)}
label{display:flex;flex-direction:column;gap:5px;font-size:.78rem;color:var(--muted);font-weight:500;min-width:0}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 11px;min-width:0;width:100%}
input[type=checkbox]{width:auto}textarea{min-height:76px;resize:vertical}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}.form .full{grid-column:1/-1}
.filters{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));padding:16px}
.err{color:var(--bad);font-size:.82rem}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--lime));border-radius:99px}
.tiles{display:flex;flex-wrap:wrap}.tiles>div{flex:1 1 140px;padding:18px 20px;border-right:1px solid var(--line)}.tiles>div:last-child{border:0}
.tiles b{display:block;font-family:var(--display);font-size:1.9rem;font-variant-numeric:tabular-nums;line-height:1.1}.tiles span{font-size:.75rem;color:var(--muted)}
.list>div{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 18px;border-top:1px solid var(--line);flex-wrap:wrap}.list>div:first-child{border-top:0}
.route{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-family:var(--mono)}.route i{font-style:normal;color:var(--muted)}
.steps{display:flex;flex-wrap:wrap;gap:6px}.steps span{padding:5px 12px;border-radius:99px;background:var(--surface2);color:var(--muted);font-size:.78rem;font-weight:500}
.steps span.done{background:var(--soft);color:var(--brand)}.steps span.now{background:var(--brand);color:var(--brand-fg)}.steps span.rev{background:var(--warn-s);color:var(--warn)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{font:inherit;border:0;background:var(--surface);color:var(--muted);padding:6px 13px;cursor:pointer}.seg button[aria-pressed=true]{background:var(--brand);color:var(--brand-fg)}
.bg{position:fixed;inset:0;background:rgba(4,12,8,.6);backdrop-filter:blur(3px);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:18px;width:100%;max-width:560px;max-height:100%;overflow:auto}
.modal.wide{max-width:860px}.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px 18px;margin:0}.kv div{min-width:0}.kv dt{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}.kv dd{margin:2px 0 0;overflow-wrap:anywhere}.psec{border-top:1px solid var(--line);padding-top:12px}
.modal>header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:12px;z-index:30;max-width:calc(100% - 32px);text-align:center}
.cert{border:3px double var(--brand);padding:22px;text-align:center;display:flex;flex-direction:column;gap:8px;margin:16px;border-radius:6px}
.foot{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:.78rem;display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between}
.ph{aspect-ratio:16/9;background:linear-gradient(135deg,var(--surface2),var(--soft));display:flex;align-items:center;justify-content:center;color:var(--gray)}
.fc{padding:0;display:flex;flex-direction:column}.fc .im{aspect-ratio:16/9;width:100%;object-fit:cover;display:block;background:var(--surface2)}.fc .in{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;padding:12px}.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;display:block}
.gal .g{position:relative}.gal .g button{position:absolute;top:4px;right:4px}
.cta{border-radius:20px;color:#fff;padding:32px;background:linear-gradient(100deg,rgba(7,59,38,.96),rgba(7,59,38,.6)),url(img/winglet.jpg) right/cover,var(--hero);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.cta p{color:#D8EBE0}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{display:inline-flex;align-items:center;gap:6px;background:var(--soft);color:var(--brand);border-radius:99px;padding:3px 6px 3px 12px;font-family:var(--mono);font-size:.78rem}
.chip button{border:0;background:rgba(0,0,0,.08);color:inherit;border-radius:50%;width:18px;height:18px;line-height:16px;cursor:pointer;padding:0}
.stage{border:1px dashed var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.addr{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}.addr label{flex:1 1 110px}
.pager{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.foot .btn{margin-left:6px}
.partners{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);text-align:center}.partners small{display:block;font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}.partners>div{display:flex;flex-wrap:wrap;gap:14px 28px;justify-content:center;align-items:center}.partners img{max-height:46px;max-width:150px;width:auto;object-fit:contain}.partners a,.partners span{display:inline-flex;opacity:.9}.partners a:hover{opacity:1}
.copy{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:.8rem;font-weight:500}.partners+.copy{margin-top:16px;border-top:0;padding-top:0}.copy+.foot{margin-top:10px;border-top:0;padding-top:0}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}.pitem{display:flex;flex-direction:column;gap:6px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px}.pitem .chk{height:70px;width:100%;display:flex;align-items:center;justify-content:center}.pitem img{max-height:60px;max-width:100%}

/* ---- marca: logos, ambiente ---- */
.brand img{width:auto}.lg.lg-d{display:none}.brand .lg.lg-l{display:block}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lg.lg-l{display:none}:root:not([data-theme="light"]) .brand .lg.lg-d{display:block}}
:root[data-theme="dark"] .lg.lg-l{display:none}:root[data-theme="dark"] .brand .lg.lg-d{display:block}

  S.inc.forEach(i=>{if(i.responded||!['Abierta','Reabierta'].includes(i.st))return;const rem=i.deadline-now;
    if(rem<=24*H&&!i.r24){i.r24=1;notify(i.pilot,t('Recordatorio: te quedan menos de 24 h para responder al incidente ','Reminder: under 24 h left to answer incident ')+i.id)}

/* Zoom: botones +/−/⌂, Ctrl + rueda (o pellizco del trackpad), pellizco en pantalla táctil y doble toque/clic. Arrastrar mueve el mapa.
   Tocar un avión abre su ficha; tocar el fondo la cierra. Las filas de la tabla también seleccionan el avión. */
let lmD=null,lmHintT=0;
function lmApply(el){const V=lmv(el.dataset.o),s=el.querySelector('svg');if(!s)return;s.setAttribute('viewBox',V.x+' '+V.y+' '+V.w+' '+lmH(V.w));s.style.setProperty('--k',V.w/360);s.classList.toggle('zm',V.w<359)}
function lmZoom(el,f,cx,cy){const V=lmv(el.dataset.o),r=el.getBoundingClientRect(),fx=r.width?(cx-r.left)/r.width:.5,fy=r.height?(cy-r.top)/r.height:.5,u=V.x+fx*V.w,v=V.y+fy*lmH(V.w);V.w=Math.max(22,Math.min(360,V.w*f));V.x=u-fx*V.w;V.y=v-fy*lmH(V.w);lmClamp(V);lmApply(el)}
function lmDraw(el){try{el.innerHTML=mapInner(JSON.parse(el.dataset.o))}catch(e){}}
function lmSelect(el,id,center){const V=lmv(el.dataset.o);V.sel=id||null;if(id&&center){const f=liveFlights().find(x=>x.id===id);if(f&&f.pos){const p=px(f.pos[0],f.pos[1]);V.w=Math.min(V.w,90);V.x=p[0]-V.w/2;V.y=p[1]-lmH(V.w)/2;lmClamp(V)}}lmDraw(el)}

  if(lmD.pts.size===0){lmD.sx=e.clientX;lmD.sy=e.clientY;lmD.moved=false;const pl=e.target.closest('.pl');lmD.hit=pl?pl.dataset.id:null}else lmD.moved=true;

  if(lmD.pts.size===1){if(!lmD.moved&&Math.hypot(e.clientX-lmD.sx,e.clientY-lmD.sy)<5)return;lmD.moved=true;
    V.x-=(e.clientX-p.x)*V.w/r.width;V.y-=(e.clientY-p.y)*lmH(V.w)/r.height;lmClamp(V);lmApply(el);el.classList.add('drag')}
  else if(lmD.pts.size===2){const o=[...lmD.pts.entries()].find(([k])=>k!==e.pointerId)[1],d0=Math.hypot(p.x-o.x,p.y-o.y),d1=Math.hypot(e.clientX-o.x,e.clientY-o.y);if(d0>0&&d1>0)lmZoom(el,d0/d1,(e.clientX+o.x)/2,(e.clientY+o.y)/2)}
  lmD.pts.set(e.pointerId,{x:e.clientX,y:e.clientY})});
const lmEnd=e=>{if(!lmD||!lmD.pts.has(e.pointerId))return;const el=lmD.el;lmD.pts.delete(e.pointerId);
